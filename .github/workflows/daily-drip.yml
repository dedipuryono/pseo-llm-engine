name: Daily LLM Matrix Drip Publisher

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Publish Next 30 LLM Pages & Sync D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python llm_drip_publisher.py 30

      - name: Commit & Push Updated Catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add llm_staging.db d1_llm_publish_batch.sql web-app/src/data/llm_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(drip): publish daily batch of 30 LLM matrix pages"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "Seluruh 960 halaman LLM sudah terbit."
          fi
